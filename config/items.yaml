# Physical items of the pick dataset (docs/collection-plan.md, scripts/common/item_registry.py).
# Filled in by the agent after each session from its contact sheet (scripts/tools/contact_sheet.sh),
# not by hand during recording.
#
#   id       short and unique: m01.. metal, p01.. plastic, g01.. generic (Pick other), o01.. other
#   class    metal | plastic | generic | other
#   design   the look: copies of one design share it. The split is by design
#   split    train | test. A test entry stands for every copy of its design: it is never recorded
#            (the recorder refuses its names), never in the gallery, YOLO frames or episodes
#   names    names that may be typed in the recorder for it (any form: "Red Bull peach" = red-bull-peach).
#            For a test item a name also matches inside a longer one (redbull-peach-2): keep them specific
#   brand, crushed, notes   optional
#
