# Settings of the pick recorder (scripts/dataset/record_pick.sh, docs/pick-dataset.md).
# Trigger, classifier, grasp check, motion and door settings are shared with the box pipeline,
# so episodes start, are judged and end exactly as the pipeline will run them.
box_pipeline: config/box_pipeline.yaml

dataset:
  repo_id: cleany-ai/cleany_pick
  root: data/pick/episodes     # HF: <namespace>/cleany_pick (scripts/dataset/sync.sh push pick)
  fps: 30
  # The material is stored as the episode's task (ACT ignores the text)
  tasks:
    metal: "Pick up the metal item"
    plastic: "Pick up the plastic item"
    other: "Pick up the item"     # Pick other: anything that is neither metal nor plastic

episode:
  timeout_s: 20
  warn_after_s: 10          # the pipeline gives the pick model grasp.timeout_s (10 s): slower demos teach a slow grasp
  end_on_grasp: true        # end when the box pipeline's grasp check holds (fingers blocked + arm lifted)

start:
  leader_hold: true         # the leader holds the hover pose until pushed; false: it goes limp, start with Space
  settle_s: 0.5             # the leader settles this long at hover before a push counts
  push_deg: 3               # any leader joint this far from where it settled: recording starts
  leader_gripper_torque: 40 # percent of its force the leader's gripper holds with under script: a hand on the trigger must not overload it
  # The script drives the leader's arm joints (home, hover, place). The leader's gripper servo is a 12 V model on the
  # leader's 5 V: it cannot move the handle (stalls, then Overload / Input voltage errors). false: the gripper is
  # never driven: the follower's gripper opens to hover_gripper on its own on the way to hover, then follows your
  # trigger (gripper_follow_step units a frame) until the episode starts, so there is no snap.
  # true: needs a 7.4 V servo in the leader's gripper.
  drive_leader_gripper: false
  hover_gripper: 30         # 0-100: how far the follower's gripper opens on its own at hover (the box pipeline uses 60)
  gripper_follow_step: 4

# The scripted moves (ready -> hover, place, home) over the box pipeline's: the follower's own limits (90 deg/s,
# acceleration 40, 10 deg/step) are what hold them back, so more than ~70 gains nothing; the teleoperated part
# keeps the limits the pipeline will run with, so the demonstrations match its dynamics.
motion:
  speed_deg_s: 70
  min_move_s: 0.6

release:
  where: transit            # transit: let go above the tray, the item falls back onto it (no hands for the next episode); bin: carry it to its bin
  gripper: 100              # fully open
  hold_s: 1.0

# Episodes to record (docs/collection-plan.md), cumulative; the panel shows the counts against `phase`
targets:
  phase: pilot
  pilot: {metal: 23, plastic: 22, other: 15}
  main: {metal: 90, plastic: 90, other: 60}

# The object library (objects/README.md): objects/train is shown in the panel with N/target records, and
# choosing one is required before each record (required: false allows records without one);
# objects/test is held out and refused. labels: record time -> id for records made before the library
items:
  registry: objects
  labels: config/item_labels.yaml
  required: true

# data/pick/items goes to the Hub as <namespace>/cleany_pick_items (the registry and labels from config/ with it)
outputs:
  yolo_frames: data/pick/items/yolo  # images/, labels/ (YOLO format, classes.txt), frames.jsonl
  crops: data/pick/items/crops       # <material>/<item>_<time>.jpg, for scripts/tools/build_gallery.sh 
  records: data/pick/items/records.jsonl  # one line per kept episode or `other` item
