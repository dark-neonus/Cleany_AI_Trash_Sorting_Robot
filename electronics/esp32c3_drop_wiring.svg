<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1160 880" width="1160" height="880" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <!-- ground symbol, origin at the wire end -->
    <g id="gnd" stroke="#000" stroke-width="2" fill="none">
      <line x1="0" y1="0" x2="0" y2="10"/>
      <line x1="-10" y1="10" x2="10" y2="10"/>
      <line x1="-6" y1="14" x2="6" y2="14"/>
      <line x1="-2" y1="18" x2="2" y2="18"/>
    </g>
  </defs>

  <rect x="0" y="0" width="1160" height="880" fill="#ffffff"/>
  <text x="30" y="34" font-size="18" font-weight="bold" fill="#000">Trash Drop Mechanism: ESP32-C3 SuperMini wiring</text>

  <!-- ===================== 12V power path ===================== -->
  <!-- mains -->
  <rect x="30" y="95" width="100" height="70" rx="4" fill="#eeeeee" stroke="#555" stroke-width="2"/>
  <text x="80" y="126" text-anchor="middle" font-weight="bold">220V AC</text>
  <text x="80" y="143" text-anchor="middle" font-size="11">mains</text>
  <line x1="130" y1="130" x2="180" y2="130" stroke="#777" stroke-width="3"/>
  <text x="155" y="122" text-anchor="middle" font-size="10" fill="#555">L N PE</text>

  <!-- Venom PSU -->
  <rect x="180" y="85" width="160" height="90" rx="4" fill="#fff8e1" stroke="#000" stroke-width="2"/>
  <text x="250" y="122" text-anchor="middle" font-weight="bold">Venom</text>
  <text x="250" y="138" text-anchor="middle" font-size="11">VST-120-12</text>
  <text x="250" y="153" text-anchor="middle" font-size="11">12V · 10A</text>
  <text x="333" y="114" text-anchor="end" font-size="11">+V</text>
  <text x="333" y="154" text-anchor="end" font-size="11">−V</text>

  <!-- +12V through F1 -->
  <line x1="340" y1="110" x2="390" y2="110" stroke="#b71c1c" stroke-width="3"/>
  <rect x="390" y="100" width="70" height="20" rx="10" fill="#e3f2fd" stroke="#000" stroke-width="2"/>
  <line x1="390" y1="110" x2="460" y2="110" stroke="#000" stroke-width="1"/>
  <text x="425" y="92" text-anchor="middle" font-weight="bold">F1 10A</text>
  <text x="425" y="140" text-anchor="middle" font-size="11">fast-blow</text>
  <line x1="460" y1="110" x2="560" y2="110" stroke="#b71c1c" stroke-width="3"/>
  <!-- 12V branch to arm + LED -->
  <line x1="500" y1="110" x2="500" y2="62" stroke="#b71c1c" stroke-width="3"/>
  <line x1="500" y1="62" x2="530" y2="62" stroke="#b71c1c" stroke-width="3"/>
  <circle cx="500" cy="110" r="4" fill="#b71c1c"/>
  <text x="536" y="67" font-size="12">12V → FE-URT-2 power in (6× STS3215), LED strip</text>

  <!-- -V to XL4015 IN- -->
  <line x1="340" y1="150" x2="560" y2="150" stroke="#000" stroke-width="3"/>
  <line x1="520" y1="150" x2="520" y2="200" stroke="#000" stroke-width="3"/>
  <line x1="520" y1="200" x2="540" y2="200" stroke="#000" stroke-width="3"/>
  <circle cx="520" cy="150" r="4" fill="#000"/>
  <text x="546" y="205" font-size="12">GND → FE-URT-2, LED strip</text>

  <!-- XL4015 -->
  <rect x="560" y="85" width="160" height="90" rx="4" fill="#e8f5e9" stroke="#000" stroke-width="2"/>
  <text x="640" y="122" text-anchor="middle" font-weight="bold">XL4015</text>
  <text x="640" y="138" text-anchor="middle" font-size="11">CV 6.5V</text>
  <text x="640" y="153" text-anchor="middle" font-size="11">CC 4.5A</text>
  <text x="567" y="114" font-size="10">IN+</text>
  <text x="567" y="154" font-size="10">IN−</text>
  <text x="713" y="114" text-anchor="end" font-size="10">OUT+</text>
  <text x="713" y="154" text-anchor="end" font-size="10">OUT−</text>

  <!-- XL4015 OUT- : star ground -->
  <line x1="720" y1="150" x2="750" y2="150" stroke="#000" stroke-width="3"/>
  <use href="#gnd" xlink:href="#gnd" x="750" y="150"/>
  <text x="766" y="174" font-size="11">star GND point</text>

  <!-- XL4015 OUT+ to ACS712 IP+ -->
  <polyline points="720,110 1080,110 1080,400 1020,400" fill="none" stroke="#e53935" stroke-width="3"/>
  <text x="900" y="102" text-anchor="middle" font-size="12" fill="#e53935">6.5V</text>

  <!-- ACS712 IP- to servo bus (6.5V, measured) -->
  <polyline points="1020,470 1120,470 1120,800 60,800 60,365" fill="none" stroke="#e53935" stroke-width="3"/>
  <text x="600" y="792" text-anchor="middle" font-size="12" fill="#e53935">6.5V servo bus (after current sensor)</text>

  <!-- C2 bulk capacitor on servo bus -->
  <circle cx="250" cy="800" r="4" fill="#e53935"/>
  <line x1="250" y1="800" x2="250" y2="815" stroke="#e53935" stroke-width="3"/>
  <line x1="236" y1="815" x2="264" y2="815" stroke="#000" stroke-width="3"/>
  <line x1="236" y1="823" x2="264" y2="823" stroke="#000" stroke-width="3"/>
  <text x="230" y="814" text-anchor="end" font-size="11">+</text>
  <line x1="250" y1="823" x2="250" y2="838" stroke="#000" stroke-width="2"/>
  <use href="#gnd" xlink:href="#gnd" x="250" y="838"/>
  <text x="274" y="826" font-size="12">C2 1000–2200µF 16V</text>

  <!-- ===================== Servos ===================== -->
  <!-- Servo 1 -->
  <rect x="120" y="330" width="160" height="70" rx="6" fill="#f3e5f5" stroke="#000" stroke-width="2"/>
  <text x="200" y="360" text-anchor="middle" font-weight="bold">Servo 1</text>
  <text x="200" y="377" text-anchor="middle" font-size="11">RDS3115</text>
  <!-- Servo 2 -->
  <rect x="120" y="440" width="160" height="70" rx="6" fill="#f3e5f5" stroke="#000" stroke-width="2"/>
  <text x="200" y="470" text-anchor="middle" font-weight="bold">Servo 2</text>
  <text x="200" y="487" text-anchor="middle" font-size="11">RDS3115</text>
  <!-- Servo 3 -->
  <rect x="120" y="550" width="160" height="70" rx="6" fill="#f3e5f5" stroke="#000" stroke-width="2"/>
  <text x="200" y="580" text-anchor="middle" font-weight="bold">Servo 3</text>
  <text x="200" y="597" text-anchor="middle" font-size="11">RDS3115</text>
  <!-- Servo 4 -->
  <rect x="120" y="660" width="160" height="70" rx="6" fill="#f3e5f5" stroke="#000" stroke-width="2"/>
  <text x="200" y="690" text-anchor="middle" font-weight="bold">Servo 4</text>
  <text x="200" y="707" text-anchor="middle" font-size="11">RDS3115</text>

  <!-- servo V+ (red wire) from bus -->
  <g stroke="#e53935" stroke-width="3">
    <line x1="60" y1="365" x2="120" y2="365"/>
    <line x1="60" y1="475" x2="120" y2="475"/>
    <line x1="60" y1="585" x2="120" y2="585"/>
    <line x1="60" y1="695" x2="120" y2="695"/>
  </g>
  <g fill="#e53935">
    <circle cx="60" cy="475" r="4"/>
    <circle cx="60" cy="585" r="4"/>
    <circle cx="60" cy="695" r="4"/>
  </g>
  <g font-size="10" fill="#555">
    <text x="126" y="369">red +</text>
    <text x="126" y="479">red +</text>
    <text x="126" y="589">red +</text>
    <text x="126" y="699">red +</text>
    <text x="274" y="369" text-anchor="end">SIG</text>
    <text x="274" y="479" text-anchor="end">SIG</text>
    <text x="274" y="589" text-anchor="end">SIG</text>
    <text x="274" y="699" text-anchor="end">SIG</text>
    <text x="206" y="396">brown −</text>
    <text x="206" y="506">brown −</text>
    <text x="206" y="616">brown −</text>
    <text x="206" y="726">brown −</text>
  </g>

  <!-- servo GND (brown wire) -->
  <g stroke="#000" stroke-width="2">
    <line x1="200" y1="400" x2="200" y2="408"/>
    <line x1="200" y1="510" x2="200" y2="518"/>
    <line x1="200" y1="620" x2="200" y2="628"/>
    <line x1="200" y1="730" x2="200" y2="738"/>
  </g>
  <use href="#gnd" xlink:href="#gnd" x="200" y="408"/>
  <use href="#gnd" xlink:href="#gnd" x="200" y="518"/>
  <use href="#gnd" xlink:href="#gnd" x="200" y="628"/>
  <use href="#gnd" xlink:href="#gnd" x="200" y="738"/>

  <!-- servo signals (orange) to ESP32 left header -->
  <g fill="none" stroke="#ef6c00" stroke-width="2.5">
    <polyline points="280,365 330,365 330,400 460,400"/>
    <polyline points="280,475 360,475 360,440 460,440"/>
    <polyline points="280,585 390,585 390,480 460,480"/>
    <polyline points="280,695 420,695 420,600 460,600"/>
  </g>

  <!-- ===================== ESP32-C3 SuperMini ===================== -->
  <rect x="505" y="318" width="50" height="24" rx="5" fill="#9e9e9e" stroke="#000" stroke-width="1.5"/>
  <text x="530" y="313" text-anchor="middle" font-size="10" fill="#555">USB-C → hub</text>
  <rect x="460" y="330" width="140" height="380" rx="8" fill="#12355b" stroke="#000" stroke-width="2"/>
  <text x="530" y="364" text-anchor="middle" font-weight="bold" fill="#fff">ESP32-C3</text>
  <text x="530" y="380" text-anchor="middle" font-weight="bold" fill="#fff">SuperMini</text>

  <!-- left header -->
  <g fill="#ffca28" stroke="#000" stroke-width="1">
    <circle cx="472" cy="400" r="5"/><circle cx="472" cy="440" r="5"/><circle cx="472" cy="480" r="5"/><circle cx="472" cy="520" r="5"/>
    <circle cx="472" cy="560" r="5"/><circle cx="472" cy="600" r="5"/><circle cx="472" cy="640" r="5"/><circle cx="472" cy="680" r="5"/>
    <circle cx="588" cy="400" r="5"/><circle cx="588" cy="440" r="5"/><circle cx="588" cy="480" r="5"/><circle cx="588" cy="520" r="5"/>
    <circle cx="588" cy="560" r="5"/><circle cx="588" cy="600" r="5"/><circle cx="588" cy="640" r="5"/><circle cx="588" cy="680" r="5"/>
  </g>
  <g font-size="12">
    <text x="482" y="404" fill="#fff" font-weight="bold">GPIO5</text>
    <text x="482" y="444" fill="#fff" font-weight="bold">GPIO6</text>
    <text x="482" y="484" fill="#fff" font-weight="bold">GPIO7</text>
    <text x="482" y="524" fill="#f28b82">GPIO8</text>
    <text x="482" y="564" fill="#f28b82">GPIO9</text>
    <text x="482" y="604" fill="#fff" font-weight="bold">GPIO10</text>
    <text x="482" y="644" fill="#f28b82">GPIO20</text>
    <text x="482" y="684" fill="#f28b82">GPIO21</text>

    <text x="578" y="404" text-anchor="end" fill="#fff" font-weight="bold">5V</text>
    <text x="578" y="444" text-anchor="end" fill="#fff" font-weight="bold">GND</text>
    <text x="578" y="484" text-anchor="end" fill="#9fb3c8">3V3</text>
    <text x="578" y="524" text-anchor="end" fill="#9fb3c8">GPIO4</text>
    <text x="578" y="564" text-anchor="end" fill="#fff" font-weight="bold">GPIO3</text>
    <text x="578" y="604" text-anchor="end" fill="#f28b82">GPIO2</text>
    <text x="578" y="644" text-anchor="end" fill="#9fb3c8">GPIO1</text>
    <text x="578" y="684" text-anchor="end" fill="#9fb3c8">GPIO0</text>
  </g>
  <!-- pin stubs for used pins -->
  <g stroke-width="2.5">
    <line x1="460" y1="400" x2="467" y2="400" stroke="#ef6c00"/>
    <line x1="460" y1="440" x2="467" y2="440" stroke="#ef6c00"/>
    <line x1="460" y1="480" x2="467" y2="480" stroke="#ef6c00"/>
    <line x1="460" y1="600" x2="467" y2="600" stroke="#ef6c00"/>
    <line x1="593" y1="400" x2="600" y2="400" stroke="#8e24aa"/>
    <line x1="593" y1="440" x2="600" y2="440" stroke="#000"/>
    <line x1="593" y1="560" x2="600" y2="560" stroke="#1565c0"/>
  </g>

  <!-- ESP32 GND -->
  <line x1="600" y1="440" x2="630" y2="440" stroke="#000" stroke-width="2.5"/>
  <use href="#gnd" xlink:href="#gnd" x="630" y="440"/>

  <!-- 5V to ACS712 VCC -->
  <line x1="600" y1="400" x2="860" y2="400" stroke="#8e24aa" stroke-width="2.5"/>
  <text x="740" y="393" text-anchor="middle" font-size="12" fill="#8e24aa">5V (USB)</text>

  <!-- ===================== ACS712 ===================== -->
  <rect x="860" y="370" width="160" height="120" rx="4" fill="#ffebee" stroke="#000" stroke-width="2"/>
  <text x="940" y="420" text-anchor="middle" font-weight="bold">ACS712</text>
  <text x="940" y="437" text-anchor="middle" font-size="11">30A</text>
  <text x="940" y="453" text-anchor="middle" font-size="11">66 mV/A</text>
  <g font-size="10">
    <text x="866" y="404">VCC</text>
    <text x="866" y="444">OUT</text>
    <text x="866" y="484">GND</text>
    <text x="1013" y="404" text-anchor="end">IP+</text>
    <text x="1013" y="474" text-anchor="end">IP−</text>
  </g>

  <!-- ACS712 GND -->
  <line x1="860" y1="480" x2="848" y2="480" stroke="#000" stroke-width="2.5"/>
  <use href="#gnd" xlink:href="#gnd" x="848" y="480"/>

  <!-- ACS712 OUT -> R1 -> GPIO3, with R2 + C1 to GND -->
  <polyline points="860,440 830,440 830,560 800,560" fill="none" stroke="#1565c0" stroke-width="2.5"/>
  <rect x="730" y="552" width="70" height="16" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="765" y="545" text-anchor="middle" font-size="12">R1 10k</text>
  <line x1="730" y1="560" x2="600" y2="560" stroke="#1565c0" stroke-width="2.5"/>
  <text x="608" y="553" font-size="10" fill="#1565c0">ADC</text>

  <!-- R2 15k -->
  <circle cx="700" cy="560" r="4" fill="#1565c0"/>
  <line x1="700" y1="560" x2="700" y2="585" stroke="#1565c0" stroke-width="2"/>
  <rect x="692" y="585" width="16" height="60" fill="#fff" stroke="#000" stroke-width="2"/>
  <line x1="700" y1="645" x2="700" y2="665" stroke="#000" stroke-width="2"/>
  <use href="#gnd" xlink:href="#gnd" x="700" y="665"/>
  <text x="714" y="612" font-size="12">R2</text>
  <text x="714" y="627" font-size="12">15k</text>

  <!-- C1 100nF -->
  <circle cx="645" cy="560" r="4" fill="#1565c0"/>
  <line x1="645" y1="560" x2="645" y2="600" stroke="#1565c0" stroke-width="2"/>
  <line x1="633" y1="600" x2="657" y2="600" stroke="#000" stroke-width="3"/>
  <line x1="633" y1="608" x2="657" y2="608" stroke="#000" stroke-width="3"/>
  <line x1="645" y1="608" x2="645" y2="625" stroke="#000" stroke-width="2"/>
  <use href="#gnd" xlink:href="#gnd" x="645" y="625"/>
  <text x="645" y="664" text-anchor="middle" font-size="11">C1</text>
  <text x="645" y="678" text-anchor="middle" font-size="11">100nF</text>

  <!-- ===================== Legend ===================== -->
  <rect x="760" y="590" width="340" height="180" rx="6" fill="#fafafa" stroke="#bbb"/>
  <text x="776" y="612" font-weight="bold">Legend</text>
  <g stroke-width="3">
    <line x1="776" y1="630" x2="806" y2="630" stroke="#b71c1c"/>
    <line x1="776" y1="650" x2="806" y2="650" stroke="#e53935"/>
    <line x1="776" y1="670" x2="806" y2="670" stroke="#8e24aa"/>
    <line x1="776" y1="690" x2="806" y2="690" stroke="#ef6c00"/>
    <line x1="776" y1="710" x2="806" y2="710" stroke="#1565c0"/>
  </g>
  <g font-size="12">
    <text x="816" y="634">12V after F1</text>
    <text x="816" y="654">6.5V servo power</text>
    <text x="816" y="674">5V from USB (ESP32 5V pin)</text>
    <text x="816" y="694">PWM 50 Hz, 3.3V logic</text>
    <text x="816" y="714">Analog: ADC = 0.6 × ACS712 OUT</text>
  </g>
  <use href="#gnd" xlink:href="#gnd" x="791" y="722"/>
  <text x="816" y="738" font-size="12">common GND, tie at XL4015 OUT−</text>
  <text x="776" y="760" font-size="12"><tspan fill="#d93025">red pin label</tspan> = do not use (strap / BOOT / UART)</text>
</svg>
