    ; Trash drop mechanism firmware for the ESP32-C3 SuperMini.
; See ../ELECTRONICS.md for wiring.
;
; esp32c3_supermini:        production: OPEN, OPEN_HOLD, CLOSE, STOP, READ only
; esp32c3_supermini_debug:  also per-servo, LEFT/RIGHT/ALL and OFF commands for tuning

[platformio]
default_envs = esp32c3_supermini

[env]
platform = espressif32@6.9.0
board = esp32-c3-devkitm-1
framework = arduino

monitor_speed = 115200
monitor_filters = send_on_enter
monitor_echo = yes
; Don't toggle DTR/RTS on open: on the native USB they can hold the C3 in reset.
monitor_dtr = 0
monitor_rts = 0

; The SuperMini has no USB-UART chip: Serial goes over the native USB CDC.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32c3_supermini]

[env:esp32c3_supermini_debug]
build_flags =
    ${env.build_flags}
    -DDEBUG_COMMANDS=1
